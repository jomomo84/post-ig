<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD Santo Domingo Sports - Partidos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --azul:#1a4b9c;--azul-oscuro:#0d2d5e;--oro:#d4a017;--oro-claro:#e8b830;
  --bg:#0a0e1a;--card:#111827;--text:#e2e8f0;--text-dim:#94a3b8;--border:#1e293b;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
.app{max-width:1320px;margin:0 auto;padding:20px}
.header{text-align:center;padding:24px 0 32px;border-bottom:2px solid var(--oro);margin-bottom:32px}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5vw,42px);color:var(--oro);letter-spacing:3px;line-height:1.1}
.header p{color:var(--text-dim);font-size:14px;margin-top:6px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.controls{background:var(--card);border-radius:16px;padding:28px;border:1px solid var(--border)}
.controls h2{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--oro);letter-spacing:2px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.field input[type=text]{width:100%;padding:10px 14px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:var(--text);font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s}
.field input:focus,.match-input:focus{border-color:var(--oro)}
.match-input{width:100%;min-height:260px;padding:12px 14px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:var(--text);font-size:12px;font-family:'Courier New',monospace;outline:none;resize:vertical;line-height:1.75;transition:border-color .2s}
.toggle-row{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid #334155}
.toggle-btn{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;background:#1e293b;color:var(--text-dim);cursor:pointer;transition:all .2s;border:none;font-family:'Barlow',sans-serif}
.toggle-btn.active{background:var(--azul);color:white}
.preview-section{position:sticky;top:20px}
.preview-section h2{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--oro);letter-spacing:2px;margin-bottom:12px;text-align:center}
.canvas-wrap{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--border);display:flex;justify-content:center;align-items:center}
canvas{max-width:100%;height:auto;border-radius:8px;display:block}
.btn-download{display:block;width:100%;margin-top:16px;padding:14px;background:linear-gradient(135deg,var(--oro),var(--oro-claro));color:var(--azul-oscuro);border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-download:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,160,23,.35)}
.btn-download:active{transform:translateY(0)}
.section-divider{border:none;border-top:1px solid #1e293b;margin:18px 0 14px}
.hint{font-size:11px;color:#64748b;margin-top:5px;line-height:1.65}
.hint code{background:#1e293b;padding:2px 5px;border-radius:4px;color:#94a3b8;font-size:10.5px}
.stat-bar{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--text-dim);background:#1e293b;padding:4px 10px;border-radius:6px;border:1px solid #334155}
.stat b{color:var(--oro)}
.layout-info{font-size:11px;color:#475569;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>CD SANTO DOMINGO SPORTS</h1>
    <p>Generador de Listado de Partidos para Instagram</p>
  </div>
  <div class="layout">

    <div class="controls">
      <h2>Configuración</h2>

      <div class="field">
        <label>Formato</label>
        <div class="toggle-row">
          <button class="toggle-btn active" id="btnPost" onclick="setFormat('post')">📸 POST (1080×1080)</button>
          <button class="toggle-btn" id="btnStory" onclick="setFormat('story')">📱 HISTORIA (1080×1920)</button>
        </div>
      </div>

      <div class="field">
        <label>Título principal</label>
        <input type="text" id="titulo" value="PRÓXIMOS PARTIDOS" oninput="render()">
      </div>

      <div class="field">
        <label>Semana / Fecha</label>
        <input type="text" id="semana" placeholder="Ej: SEMANA DEL 4 AL 10 DE MAYO 2026" oninput="render()">
      </div>

      <hr class="section-divider">

      <div class="field">
        <label>Listado de partidos</label>
        <p class="hint">
          Una línea por partido:<br>
          <code>DEPORTE;COMPETICIÓN;CATEGORÍA;RIVAL;DÍA;HORA;LUGAR;ENTRENADOR</code><br>
          Pon <code>DESCANSA</code> o <code>DESCANSO</code> como rival si no juegan.<br>
          Acepta formato con comillas tipo Excel (<code>"nombre ""B"""</code>).
        </p>
        <textarea class="match-input" id="matchData" oninput="parseAndRender()"
          placeholder="Fútbol;LIGA BRAVE;Infantil B;Torrevieja;2/5/26;12:00;Colegio;Jesús
Fútbol;FFCV;Cadete;Descansa;;;Manu
Baloncesto;FBCV;Junior;CB Orihuela;3/5/26;11:00;Pabellón;Carlos"></textarea>
        <div class="stat-bar" id="statBar"></div>
        <div class="layout-info" id="layoutInfo"></div>
      </div>
    </div>

    <div class="preview-section">
      <h2>Vista Previa</h2>
      <div class="canvas-wrap">
        <canvas id="canvas" width="1080" height="1080"></canvas>
      </div>
      <button class="btn-download" onclick="download()">⬇ DESCARGAR IMAGEN</button>
    </div>

  </div>
</div>

let logoImg = new Image();
logoImg.onload = () => render();
logoImg.src = LOGO_SRC;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let format = 'post';
let matches = [];

const SPORT_EMOJI = {
  'FÚTBOL':'⚽','FUTBOL':'⚽',
  'FÚTBOL SALA':'⚽','FUTBOL SALA':'⚽',
  'BALONCESTO':'🏀',
  'PÁDEL':'🎾','PADEL':'🎾',
  'TENIS':'🎾',
  'ATLETISMO':'🏃',
  'NATACIÓN':'🏊','NATACION':'🏊',
  'VOLEIBOL':'🏐',
  'BALONMANO':'🤾',
  'AJEDREZ':'♟️',
  'GIMNASIA':'🤸',
};
const DESCANSO_WORDS = new Set(['DESCANSA','DESCANSO','LIBRE','FREE']);

function getEmoji(dep) {
  return SPORT_EMOJI[(dep||'').toUpperCase().trim()] || '🏅';
}

// Desquota un campo CSV estilo Excel ("valor ""con comillas""")
function unquote(val) {
  val = (val || '').trim();
  if (val.startsWith('"') && val.endsWith('"') && val.length >= 2)
    val = val.slice(1, -1).replace(/""/g, '"');
  return val;
}

// Devuelve LUN/MAR/MIE/JUE/VIE/SAB/DOM dado "d/m/aa" o "d/m/aaaa"
function diaSemana(diaStr) {
  if (!diaStr) return '';
  const DIAS = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
  const m = diaStr.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if (!m) return '';
  let y = m[3].length === 2 ? '20' + m[3] : m[3];
  const d = new Date(+y, +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? '' : DIAS[d.getDay()];
}

// Trunca texto al ancho máximo dado en px
function trunc(text, maxW) {
  if (!text) return '';
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW)
    text = text.slice(0, -1);
  return text + '…';
}

// ─── PARSE ───────────────────────────────────────────────────────────────────
function parseAndRender() {
  const raw = document.getElementById('matchData').value;
  const lines = raw.split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0 && !l.startsWith('//') && !l.startsWith('#'));

  matches = lines.map((line, i) => {
    const parts = line.split(';').map(unquote);
    const rivalRaw = (parts[3] || '').trim();
    const rivalUp = rivalRaw.toUpperCase();
    const hasNoInfo = !rivalRaw && !parts[4] && !parts[5];
    const descansa = DESCANSO_WORDS.has(rivalUp) || hasNoInfo;
    return {
      idx: i,
      deporte:     (parts[0] || '').trim(),
      competicion: (parts[1] || '').trim().toUpperCase(),
      categoria:   (parts[2] || '').trim().toUpperCase() || '—',
      rival:       descansa ? '' : rivalRaw.toUpperCase(),
      dia:         (() => { const raw = (parts[4] || '').trim(); const pre = diaSemana(raw); return pre ? pre + ' ' + raw.toUpperCase() : raw.toUpperCase(); })(),
      hora:        (parts[5] || '').trim(),
      lugar:       (parts[6] || '').trim().toUpperCase(),
      entrenador:  (parts[7] || '').trim().toUpperCase(),
      emoji:       getEmoji(parts[0] || ''),
      descansa,
    };
  });

  const total = matches.length;
  const juegas = matches.filter(m => !m.descansa).length;
  const desc = total - juegas;
  document.getElementById('statBar').innerHTML = total === 0 ? '' :
    `<span class="stat"><b>${total}</b> equipo${total!==1?'s':''}</span>` +
    `<span class="stat"><b>${juegas}</b> juega${juegas!==1?'n':''}</span>` +
    (desc ? `<span class="stat"><b>${desc}</b> descansa${desc!==1?'n':''}</span>` : '');

  render();
}

// ─── FORMAT ──────────────────────────────────────────────────────────────────
function setFormat(f) {
  format = f;
  document.getElementById('btnPost').classList.toggle('active', f === 'post');
  document.getElementById('btnStory').classList.toggle('active', f === 'story');
  canvas.width = 1080;
  canvas.height = f === 'post' ? 1080 : 1920;
  render();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const W = canvas.width, H = canvas.height;
  const isStory = format === 'story';

  // Background
  ctx.fillStyle = '#08111f';
  ctx.fillRect(0, 0, W, H);

  // Diagonal lines
  ctx.save();
  ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 30; i++) {
    ctx.globalAlpha = 0.02;
    ctx.beginPath();
    ctx.moveTo(i * 90 - 300, 0); ctx.lineTo(i * 90 + 400, H);
    ctx.stroke();
  }
  ctx.restore();

  // Top gold bar
  ctx.fillStyle = '#d4a017';
  ctx.fillRect(0, 0, W, 6);

  // ── Header ──
  const headerH = isStory ? 256 : 188;
  const padV    = isStory ? 28  : 20;

  const hg = ctx.createLinearGradient(0, 0, 0, headerH + 30);
  hg.addColorStop(0, 'rgba(13,45,94,0.6)');
  hg.addColorStop(1, 'rgba(13,45,94,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 6, W, headerH + 24);

  // Logo image
  const logoR = isStory ? 52 : 40;
  const logoX = 22, logoY = padV + 4;
  if (logoImg.complete && logoImg.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(logoX + logoR, logoY + logoR, logoR, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(logoImg, logoX, logoY, logoR * 2, logoR * 2);
    ctx.restore();
  }

  // Club name
  const nameX  = logoX + logoR * 2 + 12;
  const nameS  = isStory ? 34 : 26;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffffff';
  ctx.font = `700 ${nameS}px 'Bebas Neue',sans-serif`;
  ctx.fillText('CD SANTO DOMINGO', nameX, padV + 2);
  ctx.fillStyle = '#d4a017';
  ctx.font = `700 ${Math.round(nameS * 0.88)}px 'Bebas Neue',sans-serif`;
  ctx.fillText('SPORTS', nameX, padV + 2 + nameS + 3);

  // Main title
  const titulo = (document.getElementById('titulo').value.trim() || 'PRÓXIMOS PARTIDOS').toUpperCase();
  const titS   = isStory ? 78 : 60;
  ctx.fillStyle = '#ffffff';
  ctx.font = `700 ${titS}px 'Bebas Neue',sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const titY = padV + (isStory ? 118 : 90);
  ctx.fillText(titulo, W / 2, titY);

  // Semana
  const semana = document.getElementById('semana').value.trim().toUpperCase();
  if (semana) {
    const semS = isStory ? 28 : 21;
    ctx.fillStyle = '#d4a017';
    ctx.font = `600 ${semS}px 'Barlow Condensed',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(semana, W / 2, titY + semS + 5);
  }

  // Separator
  ctx.fillStyle = 'rgba(212,160,23,0.4)';
  ctx.fillRect(40, headerH - 10, W - 80, 1);
  ctx.fillStyle = '#d4a017';
  ctx.fillRect(40, headerH - 9, 100, 2);

  // ── Matches area ──
  const footerH  = isStory ? 64 : 50;
  const contentY = headerH + 6;
  const contentH = H - headerH - footerH - 6;
  const n        = matches.length;

  if (n === 0) {
    ctx.fillStyle = '#1e293b';
    ctx.font = `400 ${isStory ? 28 : 22}px 'Barlow',sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Pega el listado de partidos en el panel izquierdo', W / 2, contentY + contentH / 2);
  } else {
    const MIN_ROW = 68;
    const singleRowH = contentH / n;
    const useTwoCols = singleRowH < MIN_ROW;

    if (useTwoCols) {
      const half    = Math.ceil(n / 2);
      const rowH    = Math.min(Math.floor(contentH / half), 200);
      const halfW   = Math.floor(W / 2);

      // Column divider
      ctx.fillStyle = 'rgba(212,160,23,0.18)';
      ctx.fillRect(halfW, contentY + 10, 1, Math.min(half * rowH, contentH) - 20);

      matches.forEach((m, i) => {
        const col  = i < half ? 0 : 1;
        const row  = i < half ? i : i - half;
        drawMatch(m, i, contentY + row * rowH, rowH, col * halfW, halfW, isStory);
      });
      document.getElementById('layoutInfo').textContent =
        `Diseño: 2 columnas · ${half} filas · ${Math.round(rowH)}px por fila`;
    } else {
      const rowH = Math.floor(singleRowH);
      matches.forEach((m, i) =>
        drawMatch(m, i, contentY + i * rowH, rowH, 0, W, isStory));
      document.getElementById('layoutInfo').textContent =
        `Diseño: 1 columna · ${n} filas · ${rowH}px por fila`;
    }
  }

  // ── Footer ──
  const footerY = H - footerH;
  const fg = ctx.createLinearGradient(0, footerY - 24, 0, H - 6);
  fg.addColorStop(0, 'rgba(8,17,31,0)');
  fg.addColorStop(1, 'rgba(8,17,31,0.9)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, footerY - 24, W, footerH + 24);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = `400 ${isStory ? 19 : 15}px 'Barlow',sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('CD SANTO DOMINGO SPORTS', W / 2, footerY + footerH / 2);

  // Bottom gold bar
  ctx.fillStyle = '#d4a017';
  ctx.fillRect(0, H - 6, W, 6);
}

// Renderiza emoji en color usando un canvas offscreen para evitar el modo monocromo
function drawColorEmoji(emoji, x, y, size, alpha) {
  const pad = Math.ceil(size * 0.15);
  const cw  = size + pad * 2;
  const tmp = document.createElement('canvas');
  tmp.width  = cw;
  tmp.height = cw;
  const tc = tmp.getContext('2d');
  tc.font = `${size}px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif`;
  tc.textAlign    = 'center';
  tc.textBaseline = 'middle';
  tc.fillText(emoji, cw / 2, cw / 2);
  ctx.globalAlpha = alpha;
  ctx.drawImage(tmp, x - pad, y - cw / 2, cw, cw);
  ctx.globalAlpha = 1;
}

// ─── DRAW ONE ROW ─────────────────────────────────────────────────────────────
function drawMatch(m, idx, y, rowH, offsetX, colW, isStory) {
  const isDes  = m.descansa;
  const padL   = offsetX + 10;
  const emSize = Math.min(Math.round(rowH * 0.45), colW < 600 ? 40 : 54);
  const textX  = padL + emSize + 14;
  const rightX = offsetX + colW - 10;
  const midY   = y + rowH / 2;

  // Alternating row tint
  if (idx % 2 === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.028)';
    ctx.fillRect(offsetX, y, colW, rowH);
  }

  // Left accent bar
  ctx.fillStyle = isDes ? '#1e2a3a' : '#d4a017';
  ctx.fillRect(offsetX, y + 7, 3, rowH - 14);

  // Row separator
  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  ctx.fillRect(padL, y + rowH - 1, colW - 20, 1);

  // Emoji (offscreen canvas para forzar color)
  drawColorEmoji(m.emoji, padL, midY - rowH * 0.04, emSize, isDes ? 0.28 : 1);

  const availW = rightX - textX;

  // ═══ LAYOUT según altura de fila ═══

  if (rowH >= 108) {
    // ── 3 líneas ──
    const catS  = Math.min(Math.round(rowH * 0.25), colW < 600 ? 28 : 36);
    const compS = Math.min(Math.round(rowH * 0.17), colW < 600 ? 19 : 25);
    const infoS = Math.min(Math.round(rowH * 0.16), colW < 600 ? 18 : 23);
    const l1 = y + rowH * 0.29, l2 = y + rowH * 0.54, l3 = y + rowH * 0.79;

    // Categoría
    ctx.fillStyle = isDes ? '#94a3b8' : '#f1f5f9';
    ctx.font = `700 ${catS}px 'Bebas Neue',sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(trunc(m.categoria, availW - (m.entrenador ? 160 : 10)), textX, l1);

    // Entrenador (arriba derecha)
    if (m.entrenador) {
      ctx.fillStyle = isDes ? '#64748b' : '#64748b';
      ctx.font = `400 ${infoS - 1}px 'Barlow',sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText(trunc('👤 ' + m.entrenador, 260), rightX, l1);
      ctx.textAlign = 'left';
    }

    // Competición
    ctx.fillStyle = isDes ? '#64748b' : '#d4a017';
    ctx.font = `600 ${compS}px 'Barlow Condensed',sans-serif`;
    ctx.fillText(trunc(m.competicion, availW), textX, l2);

    // Info / descansa
    if (isDes) {
      ctx.fillStyle = '#64748b';
      ctx.font = `500 italic ${infoS}px 'Barlow',sans-serif`;
      ctx.fillText('Descansa esta semana', textX, l3);
    } else {
      const parts = ['vs ' + (m.rival || '—')];
      if (m.dia)  parts.push(m.dia);
      if (m.hora) parts.push(m.hora + 'h' + (m.lugar ? ' (' + m.lugar + ')' : ''));
      else if (m.lugar) parts.push('(' + m.lugar + ')');
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = `600 ${infoS}px 'Barlow',sans-serif`;
      ctx.fillText(trunc(parts.join('  ·  '), availW), textX, l3);
    }

  } else if (rowH >= 72) {
    // ── 2 líneas ──
    const catS  = Math.min(Math.round(rowH * 0.28), colW < 600 ? 24 : 30);
    const infoS = Math.min(Math.round(rowH * 0.20), colW < 600 ? 17 : 22);
    const l1 = y + rowH * 0.36, l2 = y + rowH * 0.73;

    // Categoría
    ctx.fillStyle = isDes ? '#94a3b8' : '#f1f5f9';
    ctx.font = `700 ${catS}px 'Bebas Neue',sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(trunc(m.categoria, availW - (m.entrenador ? 150 : 10)), textX, l1);

    // Entrenador (arriba derecha)
    if (m.entrenador) {
      ctx.fillStyle = '#64748b';
      ctx.font = `400 ${infoS - 1}px 'Barlow',sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText(trunc('👤 ' + m.entrenador, 220), rightX, l1);
      ctx.textAlign = 'left';
    }

    // Línea 2: comp · rival · día · hora
    if (isDes) {
      ctx.fillStyle = '#64748b';
      ctx.font = `500 italic ${infoS}px 'Barlow Condensed',sans-serif`;
      const compPart = m.competicion ? m.competicion + '  ·  ' : '';
      ctx.fillText(compPart + 'Descansa', textX, l2);
    } else {
      const parts = [];
      if (m.competicion) parts.push(m.competicion);
      parts.push('vs ' + (m.rival || '—'));
      if (m.dia)  parts.push(m.dia);
      if (m.hora) parts.push(m.hora + 'h' + (m.lugar ? ' (' + m.lugar + ')' : ''));
      else if (m.lugar) parts.push('(' + m.lugar + ')');
      ctx.fillStyle = 'rgba(255,255,255,0.90)';
      ctx.font = `600 ${infoS}px 'Barlow Condensed',sans-serif`;
      ctx.fillText(trunc(parts.join('  ·  '), availW), textX, l2);
    }

  } else {
    // ── Súper compacto: 1 línea ──
    const catS  = Math.min(Math.round(rowH * 0.30), colW < 600 ? 20 : 24);
    const infoS = Math.min(Math.round(rowH * 0.23), colW < 600 ? 15 : 19);

    // Categoría (izquierda)
    ctx.fillStyle = isDes ? '#94a3b8' : '#f1f5f9';
    ctx.font = `700 ${catS}px 'Bebas Neue',sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(trunc(m.categoria, availW * 0.42), textX, midY);

    // Info (derecha)
    const right = isDes
      ? 'Descansa'
      : [m.rival ? 'vs ' + m.rival : '', m.dia, m.hora ? m.hora + 'h' + (m.lugar ? ' (' + m.lugar + ')' : '') : (m.lugar ? '(' + m.lugar + ')' : '')].filter(Boolean).join(' · ');
    ctx.fillStyle = isDes ? '#64748b' : 'rgba(255,255,255,0.90)';
    ctx.font = isDes ? `500 italic ${infoS}px 'Barlow Condensed',sans-serif` : `500 ${infoS}px 'Barlow Condensed',sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(trunc(right, availW * 0.55), rightX, midY);
    ctx.textAlign = 'left';
  }
}

// ─── DOWNLOAD ─────────────────────────────────────────────────────────────────
function download() {
  const link = document.createElement('a');
  const semana = document.getElementById('semana').value
    .replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_áéíóúÁÉÍÓÚñÑ]/g,'') || 'partidos';
  const suffix = format === 'story' ? '_story' : '_post';
  link.download = 'SDS_partidos_' + semana + suffix + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.fonts.ready.then(() => render());
